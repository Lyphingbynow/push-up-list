<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: rgb(172, 172, 187);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .todo-container{
            width: 400px;
        }
        h1{
            color: brown;
            font-size: 36px;
            margin-bottom: 20px;
        }
        .input-group{
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"]{
            flex:1;
            padding: 8px 12px;
            font-size: 16px;
            border: 1px salmon;
            outline:none;
        } 
        .btn-add{
            padding:8px 16px;
            background-color: beige;
            border: 1px solid;
            cursor: pointer;
            font-size: 14px;
            color: #333;
        }
        .btn-add:hover{
            background-color: rgb(189, 70, 128);
        }
        ul{
            list-style: none;
            padding:0;
            margin: 0;
        }
        li{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
        }
        .task-text{
            font-size: 16px;
            color: #333;
        }
        .btn-delete{
            background-color: crimson;
            color: white;
            border: none;
            padding: 6px 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-delete:hover{
            background-color: #96cc00
        }
    </style>
</head>
<body>
    <div class="to-container">
        <h1>To-Do List</h1>
        <div class="input-group">
            <input type="text" id="taskInput"placeholder="">
            <button class="btn-add" onclick="addTask()">Add Task</button>
            
        </div>
        <ul id="tasklist"></ul>
    </div>
    <script>
        function addTask(){
            const input = document.getElementById('taskInput');
            const taskText = input.value.trim();
            if (taskText ==='') return;
            const li = document.createElement('li');
            li.innerHTML = `
            <span class="task-text">${taskText}</span>
            <button class="btn-delete" onclick="deleteTask(this)">Delete</button>
            ;`
            document.getElementById('tasklist').appendChild(li);
            input.value = '';
        }
        function deleteTask(button){
            button.parentElement.remove();
        }      
    </script>
</body>
</html>
